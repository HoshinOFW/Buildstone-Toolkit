plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "buildstonetoolkit.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
}

dependencies {
    forge "net.minecraftforge:forge:$project.forge_version"

    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"
    modImplementation("mezz.jei:jei-$minecraft_version-forge:$jei_version")


    common(project(path: ':1.20.1:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':1.20.1:common', configuration: 'transformProductionForge')

    implementation("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"))

}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
