plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"

    // Set as an API so that downstream projects can see it.
    api( "dev.architectury:architectury-neoforge:$project.architectury_api_version")

    modImplementation("mezz.jei:jei-$project.minecraft_version-neoforge:$project.jei_version")

    common(project(path: ':1.21.1:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':1.21.1:common', configuration: 'transformProductionNeoForge')
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
