plugins {
    id 'buildstonetoolkit-repositories'

    id 'multiloader-loader'
    id 'net.neoforged.moddev'

    id "multiloader-configuration-alias"

    id "buildstonetoolkit-dependencies"
}

evaluationDependsOn(":${multiversion.mcVersion()}:common")

neoForge {
    version = neoforge_version

    def commonResources = project(":${multiversion.mcVersion()}:common").sourceSets.main.resources.srcDirs.first()
    def at = new File(commonResources, 'META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric

            systemProperty("forge.logging.markers", "")
            systemProperty("forge.logging.console.level", "debug")
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            //jvmArgs("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgs "-XX:+UnlockCommercialFeatures" // uncomment for profiling

            systemProperty("mixin.debug.export", "true")
            systemProperty("mixin.debug.verbose", "true")

            programArgument("-mixin.config=create.mixins.json")
            programArgument("-mixin.config=ponder.mixins.json")
        }

        configureEach {

        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', sourceSets.main.resources.srcDirs.first().absolutePath

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    //annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }