plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

evaluationDependsOn(":${multiversion.mcVersion()}:common")

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    if (multiversion.isMcVersion("1.20.1")) {
        implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
        implementation(project(":${multiversion.mcVersion()}:common")) {
            capabilities {
                requireCapability "$maven_group:$mod_id"
            }
        }
    }
}

loom {
    def commonResources = project(":${multiversion.mcVersion()}:common").sourceSets.main.resources.srcDirs.first()
    def aw = new File(commonResources, "${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
