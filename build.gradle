plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    description = rootProject.description
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${project.minecraft_version}"
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.terraformersmc.com/" } // Optional, but safe
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    processResources {
        var replaceProperties = [
                mod_id          : project.mod_id,
                mod_version     : project.mod_version,
                mod_name        : project.mod_name,
                mod_author      : project.mod_author,
                mod_description : project.mod_description,
                mod_license     : project.mod_license,
                minecraft_version: project.minecraft_version,
                architectury_api_version: project.architectury_api_version,
                fabric_loader_version: project.fabric_loader_version
        ]

        replaceProperties.put("file", [jarVersion: project.version])

        filesMatching(['META-INF/mods.toml', 'fabric.mod.json']) {
            expand(replaceProperties)
        }
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
        }
    }
}
