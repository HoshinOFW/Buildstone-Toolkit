plugins {
    id "com.github.hoshinofw.multiversion.multiversion" version "0.7.6"
    id "groovy"
    id "groovy-gradle-plugin"
    id "com.gradle.plugin-publish" version "1.3.1"

    id "idea"
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

multiversionResources {
    replaceWithString = [
            "mod_license" : mod_license.toString(),
            "mod_description" : mod_description.toString(),
            "mod_author" : mod_author.toString(),
    ]

    replaceWithProperty = [
            "fabric_loader_version": "fabric_loader_version",
            "fabric_api_version": "fabric_api_version",
            "forge_version": "forge_version",
            "neoforge_version": "neoforge_version",
            "architectury_api_version": "architectury_api_version"
    ]
}

multiversionConfiguration {
    automaticArchApi = true
}

multiversion.configureAll()

subprojects {p ->
    if (!multiversion.isVersionedModule()) return
    //All of this is create and ponder and their dependency repos...
    repositories {
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.ithundxr.dev/snapshots" }
        maven { url = "https://mvn.devos.one/releases" }
        maven { url = "https://mvn.devos.one/snapshots" }
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
        maven { url = "https://maven.tterrag.com/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }

        maven {
            url = "https://jitpack.io/"
            content { includeGroupAndSubgroups("com.github") }
        }

        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        maven { url = "https://maven.shedaniel.me" } // Cloth Config, REI
        maven { url = "https://maven.blamejared.com" } // JEI
        maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu, EMI
    }

    dependencies {
        modRuntimeOnly("mezz.jei:jei-${multiversion.mcVersion()}-${multiversion.moduleType()}:${p.jei_version}")

        //Bundle ponder and provide create classes only for versions where it exists
        //TODO Pick the right create versions, not just the latest in the maven.
        if (multiversion.mcVersion() in ["1.20.1", "1.21.1"]) {
            //Create needs JEI classes.
            modCompileOnly("mezz.jei:jei-${multiversion.mcVersion()}-${multiversion.moduleType()}-api:${p.jei_version}")

            modImplementation("net.createmod.ponder:Ponder-${multiversion.moduleTypeCapitalized()}-${multiversion.mcVersion()}:${p.ponder_version}") {
                exclude group: "io.github.fabricators_of_create.Porting-Lib"
                transitive = false
            }

            if (!multiversion.isCommon()) {
                include ("net.createmod.ponder:Ponder-${multiversion.moduleTypeCapitalized()}-${multiversion.mcVersion()}:${p.ponder_version}")
            }

            if (multiversion.isNeoForge() || multiversion.isForge() || multiversion.isCommon()) {
                //Giving common access to forge classes is not a good idea overall, but 1.21.1 fabric has not been released yet
                modImplementation("com.simibubi.create:create-${multiversion.mcVersion()}:${p.create_version}") {
                    transitive = false
                }
                String flywheelModule = multiversion.isMcVersion("1.20.1") ? "forge" : "neoforge"
                modCompileOnly("dev.engine-room.flywheel:flywheel-$flywheelModule-api-${multiversion.mcVersion()}:${p.flywheel_version}")
                modRuntimeOnly("dev.engine-room.flywheel:flywheel-$flywheelModule-${multiversion.mcVersion()}:${p.flywheel_version}")
                modImplementation("com.tterrag.registrate:Registrate:${p.registrate_version}")
            }

            if (multiversion.isFabric() && multiversion.isMcVersion("1.20.1")) {
                modImplementation("com.simibubi.create:create-fabric-${multiversion.mcVersion()}:$p.create_version") {
                    //exclude group: "io.github.fabricators_of_create.Porting-Lib"
                }
            }
        }
    }
}