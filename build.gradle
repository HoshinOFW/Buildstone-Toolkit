plugins {
    id "com.github.hoshinofw.multiversion.multiversion" version "0.4.11"
    id "groovy"
    id "groovy-gradle-plugin"
    id "com.gradle.plugin-publish" version "1.3.1"

    id "idea"
    id 'com.gradleup.shadow' version '8.3.6' apply false

    //id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
    //id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    //id 'architectury-plugin' version '3.4-SNAPSHOT' apply false
    //id "me.modmuss50.mod-publish-plugin" version "1.1.0" apply false

}

multiversionResources {
    replaceProperties = [
            "mod_license" : mod_license.toString(),
            "mod_description" : mod_description.toString(),
            "mod_author" : mod_author.toString()
    ]
}

multiversionModules {
    common = ['common']
    fabric = ['fabric']
    forge = ['forge']
    neoforge = ['neoforge']

    patchModules = [
            'forge', 'fabric', 'neoforge',
                    'common']
}


subprojects {p ->
    apply 'plugin': 'com.gradleup.shadow'

    if (!multiversion.isVersionedModule()) return

    repositories {
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.ithundxr.dev/snapshots" }
        maven { url = "https://maven.tterrag.com/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port

        maven {
            url = "https://jitpack.io/"
            content { includeGroupAndSubgroups("com.github") }
        }
    }

    configurations {
        shadowBundle
        implementation.extendsFrom(shadowBundle)
    }

    dependencies {
        if (false) {
            shadowBundle("net.createmod.ponder:Ponder-${multiversion.moduleTypeCapitalized()}-${p.minecraft_version}:${p.ponder_version}") {
                exclude group: "io.github.fabricators_of_create.Porting-Lib"
                transitive = false
            }
        }
    }

    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = "dev-shadow"
    }

    remapJar {
        inputFile.set(shadowJar.archiveFile)
        dependsOn shadowJar
    }

}