plugins {
    id "com.github.hoshinofw.multiversion.multiversion" version "0.9.0"
    id "groovy"
    id "groovy-gradle-plugin"
    id "com.gradle.plugin-publish" version "1.3.1"

    id "idea"
    id 'com.gradleup.shadow' version '8.3.6' apply false

    id 'fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false
}

def requestedTasks = gradle.startParameter.taskNames
def loweredTasks = requestedTasks*.toLowerCase()
boolean ideSync = System.getProperty('idea.sync.active') == 'true'
boolean namesFabric = loweredTasks.any { it.contains('fabric') }
boolean allNonFabricModule = !requestedTasks.isEmpty() &&
        loweredTasks.every { it.contains(':forge:') || it.contains(':neoforge:') }
boolean aggregateBuild = !requestedTasks.isEmpty() && !allNonFabricModule

create_fabric = create_fabric || (!ideSync && (namesFabric || aggregateBuild))

logger.info("create_fabric = {} (requestedTasks={}, ideSync={})", create_fabric, requestedTasks, ideSync)

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

multiversionResources {
    replaceWithString = [
            "mod_license" : mod_license.toString(),
            "mod_description" : mod_description.toString(),
            "mod_author" : mod_author.toString(),
    ]

    replaceWithProperty = [
            "fabric_loader_version": "fabric_loader_version",
            "fabric_api_version": "fabric_api_version",
            "forge_version": "forge_version",
            "neoforge_version": "neoforge_version",
            "architectury_api_version": "architectury_api_version",
            "mixin_booster_version": "mixin_booster_version"
    ]
}

multiversion.configureAll()