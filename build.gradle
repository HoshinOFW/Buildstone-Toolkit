plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    description = rootProject.description
}

def capitalizeFirst = { String s ->
    s ? s[0].toUpperCase() + s.substring(1) : s
}

// Helper predicates
static def is120(p) { p.path.startsWith(':1.20.1:') }
static def is121(p) { p.path.startsWith(':1.21.1:') }

def isCommon   = { Project p -> p.name == "common" }
def isFabric   = { Project p -> p.name == "fabric" }
def isForge    = { Project p -> p.name == "forge" }
def isNeoForge = { Project p -> p.name == "neoforge" }

def isNotBaseVersionModule = {Project p -> isCommon(p) || isFabric(p) || isForge(p) || isNeoForge(p)}

// MC version group helpers
def mcVersion = { Project p ->
    p.path.split(':').findAll { it }[0]
}

def getTransformProduction = {Project p ->
    if (isCommon(p)) {null}
    return "transformProduction${capitalizeFirst(project.name)}"
}

def configureArchitecturyPlatform = { Project p, Object ext ->
    if (p.name == "common") {
        def enabled = (p.findProperty("enabled_platforms") ?: "")
                .toString()
                .split(',')
                .collect { it.trim() }
                .findAll { it }

        ext.common(enabled)
        return
    }

    // platform modules
    ext.platformSetupLoomIde()

    switch (p.name) {
        case "fabric":   ext.fabric(); break
        case "forge":    ext.forge(); break
        case "neoforge": ext.neoForge(); break
    }
}

subprojects { p ->
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'java-library'
    if (!isCommon(p)) {
        apply plugin: "com.gradleup.shadow"
    }

    String commonPath = ":${project.minecraft_version}:common"
    String transformProductionConfiguration = getTransformProduction(p)

    p.extensions.configure("architectury") { ext ->
            configureArchitecturyPlatform(p, ext)
    }

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${project.minecraft_version}"
    }

    if (!isCommon(p)) {
        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
            developmentNeoForge.extendsFrom common

            // Files in this configuration will be bundled into your mod using the Shadow plugin.
            // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = "https://jitpack.io" }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    }

    loom {
        silentMojangMappingsLicense()
        if (isForge(p)) {
            forge {
                mixinConfig "buildstonetoolkit.mixins.json"
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$project.minecraft_version"
        mappings loom.officialMojangMappings()

        if (isCommon(p)) {
            modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
        } else if (isFabric(p)) {
            modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
            modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
        } else if (isForge(p)) {
            forge "net.minecraftforge:forge:$project.forge_version"
        } else if (isNeoForge(p)) {
            neoForge "net.neoforged:neoforge:$project.neoforge_version"
        }

        if (isCommon(p)) {
            modImplementation "dev.architectury:architectury:$project.architectury_api_version"
        } else if (isNotBaseVersionModule(p)) {
            common(project(path: commonPath, configuration: 'namedElements')) { transitive = false }
            shadowBundle project(path: commonPath, configuration: transformProductionConfiguration)
            modImplementation "dev.architectury:architectury-${project.name}:$project.architectury_api_version"
            modImplementation("mezz.jei:jei-$project.minecraft_version-$project.name:$project.jei_version")
        }

        if (is120(p)) {
            implementation("io.github.llamalad7:mixinextras-$project.name:${project.mixin_extras_version}")
            compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"))
        }

    }

    processResources {
        var replaceProperties = [
                mod_id          : project.mod_id,
                mod_version     : project.mod_version,
                mod_name        : project.mod_name,
                mod_author      : project.mod_author,
                mod_description : project.mod_description,
                mod_license     : project.mod_license,
                minecraft_version: project.minecraft_version,
                architectury_api_version: project.architectury_api_version,
                fabric_loader_version: project.fabric_loader_version
        ]

        replaceProperties.put("file", [jarVersion: project.version])

        filesMatching(['META-INF/mods.toml', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand(replaceProperties)
        }
    }

    java {
        withSourcesJar()
        if (is120(p)) {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        } else {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
    }

    tasks.withType(JavaCompile).configureEach {
        if (is120(p)) {
            options.release = 17
        } else if (is121(p)) {
            options.release = 21
        } else {
            options.release = 21
        }
    }

    if (!isCommon(p)) {
        shadowJar {
            configurations = [project.configurations.shadowBundle]
            archiveClassifier = 'dev-shadow'
        }

        remapJar {
            inputFile.set shadowJar.archiveFile
        }
    } else if (isNotBaseVersionModule(p)) { //TODO TEMPORARILY DISABLED
        def sharedRoot = rootProject.file("common")

        sourceSets {
            main {
                java.srcDir sharedRoot.toPath().resolve("src/main/java").toFile()
                resources.srcDir sharedRoot.toPath().resolve("src/main/resources").toFile()
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

//Common tasks
tasks.register("build1_20_1") {
    group = "build"
    dependsOn(":1.20.1:common:build", ":1.20.1:fabric:build", ":1.20.1:forge:build")
}
tasks.register("build1_21_1") {
    group = "build"
    dependsOn(":1.21.1:common:build", ":1.21.1:fabric:build", ":1.21.1:neoforge:build")
}

def collectJarFrom = { String mc, String loader, String projectPath ->
    def modVer = rootProject.mod_version.toString()
    def destDir = layout.projectDirectory.dir("builds/${modVer}/${mc}/${loader}")

    tasks.register("collect_${mc.replace('.','_')}_${loader}", Copy) {
        group = "distribution"
        description = "Builds ${projectPath} and collects jars into builds/${modVer}/${mc}/${loader}"

        dependsOn("${projectPath}:build")

        from(project(projectPath).layout.buildDirectory.dir("libs"))
        into(destDir)

        include("*.jar")
        exclude("*-sources.jar")
        exclude("*-javadoc.jar")
        exclude("*-shadow.jar")
        exclude("*-dev.jar")
        exclude("*-dev-shadow.jar")
        exclude("*-all.jar")

        doFirst {
            if (destDir.asFile.exists()) {
                destDir.asFile.deleteDir()
            }
            destDir.asFile.mkdirs()
        }
    }
}


// Per-module collectors
collectJarFrom("1.20.1", "fabric",   ":1.20.1:fabric")
collectJarFrom("1.20.1", "forge",    ":1.20.1:forge")
collectJarFrom("1.21.1", "fabric",   ":1.21.1:fabric")
collectJarFrom("1.21.1", "neoforge", ":1.21.1:neoforge")

// Aggregate collectors
tasks.register("collectBuilds120") {
    group = "distribution"
    dependsOn("collect_1_20_1_fabric", "collect_1_20_1_forge")
}
tasks.register("collectBuilds121") {
    group = "distribution"
    dependsOn("collect_1_21_1_fabric", "collect_1_21_1_neoforge")
}
tasks.register("collectBuildsAll") {
    group = "distribution"
    dependsOn("collectBuilds120", "collectBuilds121")
}

//Patch chaining test...
import groovy.io.FileType

// ---- helpers ----
def isVersionCommon = { Project p ->
    // matches :1.20.1:common, :1.21.1:common, :1.21.11:common, etc.
    def parts = p.path.split(':').findAll { it }
    parts.size() == 2 && parts[1] == 'common' && (parts[0] ==~ /\d+(\.\d+){1,3}/)
}

def parseVer = { String v -> v.split(/\./).collect { it as int } }
def compareVer = { String a, String b ->
    def pa = parseVer(a); def pb = parseVer(b)
    def n = Math.max(pa.size(), pb.size())
    for (int i = 0; i < n; i++) {
        def ai = i < pa.size() ? pa[i] : 0
        def bi = i < pb.size() ? pb[i] : 0
        if (ai != bi) return ai <=> bi
    }
    0
}

def relFileSet = { File root ->
    def out = new LinkedHashSet<String>()
    if (!root.exists()) return out
    root.eachFileRecurse(FileType.FILES) { f ->
        def rel = root.toPath().relativize(f.toPath()).toString().replace('\\','/')
        out.add(rel)
    }
    out
}

// ---- patch chain wiring ----
gradle.projectsEvaluated {
    def sharedJava = rootProject.file("common/src/main/java")
    def sharedRes  = rootProject.file("common/src/main/resources")

    def commons = rootProject.subprojects.findAll { isVersionCommon(it) }

    def verToProj = [:]
    commons.each { p ->
        def ver = p.path.split(':').findAll { it }[0]
        verToProj[ver] = p
    }

    def versions = verToProj.keySet().toList().sort { a, b -> compareVer(a, b) }

    if (versions.size() <= 1) {
        logger.lifecycle("[patch-common] Only one version common found; no patching needed.")
        return
    }

    // Chain:
    for (int i = 1; i < versions.size(); i++) {
        def patchVer = versions[i]
        def baseVer  = versions[i - 1]

        def patchP = verToProj[patchVer]
        def baseP  = verToProj[baseVer]

        patchP.logger.lifecycle("[patch-common] ${patchP.path} patches ${baseP.path}")

        def patchJava = patchP.file("src/main/java")
        def patchRes  = patchP.file("src/main/resources")

        // ---------- Java: compile while all the way back (shared -> all previous -> patch)h ----------
        patchP.tasks.withType(JavaCompile).configureEach { JavaCompile jc ->
            if (jc.name != "compileJava") return

            def overrideRel = new LinkedHashSet<String>()

            overrideRel.addAll(relFileSet(patchJava))
            for (int j = i - 1; j >= 0; j--) {
                def v = versions[j]
                def proj = verToProj[v]
                overrideRel.addAll(relFileSet(proj.file("src/main/java")))
            }

            def trees = []

            trees << patchP.fileTree(sharedJava) { include("**/*.java") }

            for (int j = 0; j < i; j++) {
                def v = versions[j]
                def proj = verToProj[v]
                def layerJava = proj.file("src/main/java")

                trees << patchP.fileTree(layerJava) {
                    include("**/*.java")
                    exclude(overrideRel)
                }
            }

            trees << patchP.fileTree(patchJava) { include("**/*.java") }

            jc.setSource(patchP.files(trees))
        }


        // ---------- Resources: ordered copy (shared -> all previous -> patch) ----------
        patchP.plugins.withId("java") {
            def resDirs = []
            resDirs << sharedRes

            for (int j = 0; j < i; j++) {
                def v = versions[j]
                resDirs << verToProj[v].file("src/main/resources")
            }

            resDirs << patchRes

            patchP.extensions.configure(SourceSetContainer) { SourceSetContainer ss ->
                ss.named("main") { SourceSet main ->
                    main.resources.setSrcDirs(resDirs)
                }
            }

            patchP.tasks.named("processResources").configure { pr ->
                pr.duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
        }



    }
}
