plugins {
    id "idea"
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false

    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    description = rootProject.description
}

def capitalizeFirst = { String s ->
    s ? s[0].toUpperCase() + s.substring(1) : s
}

// Helper predicates
static def is120(p) { p.path.startsWith(':1.20.1:') }
static def is121(p) { p.path.startsWith(':1.21.1:') }

def isCommon   = { Project p -> p.name == "common" }
def isFabric   = { Project p -> p.name == "fabric" }
def isForge    = { Project p -> p.name == "forge" }
def isNeoForge = { Project p -> p.name == "neoforge" }

def isNotBaseVersionModule = {Project p -> isCommon(p) || isFabric(p) || isForge(p) || isNeoForge(p)}

def mcVersion = { Project p ->
    p.path.split(':').findAll { it }[0]
}

def getTransformProduction = {Project p ->
    if (isCommon(p)) {null}
    if (isFabric(p)) {return "transformProductionFabric"}
    if (isForge(p)) {return "transformProductionForge"}
    if (isNeoForge(p)) {return "transformProductionNeoForge"}
    return null
}

def configureArchitecturyPlatform = { Project p, Object ext ->
    if (p.name == "common") {
        def enabled = (p.findProperty("enabled_platforms") ?: "")
                .toString()
                .split(',')
                .collect { it.trim() }
                .findAll { it }

        ext.common(enabled)
        return
    }

    ext.platformSetupLoomIde()

    switch (p.name) {
        case "fabric":   ext.fabric(); break
        case "forge":    ext.forge(); break
        case "neoforge": ext.neoForge(); break
    }
}

subprojects { p ->
    apply plugin: "idea"
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'java-library'
    if (!isCommon(p)) {
        apply plugin: "com.gradleup.shadow"
    }

    String commonPath = ":${project.minecraft_version}:common"
    String transformProductionConfiguration = getTransformProduction(p)

    p.extensions.configure("architectury") { ext ->
            configureArchitecturyPlatform(p, ext)
    }

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${project.minecraft_version}"
    }

    if (!isCommon(p)) {
        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
            if (isFabric(p)) {
                developmentFabric.extendsFrom common
            } else if (isForge(p)) {
                developmentForge.extendsFrom common
            } else if (isNeoForge(p)) {
                developmentNeoForge.extendsFrom common
            }

            // Files in this configuration will be bundled into your mod using the Shadow plugin.
            // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = "https://jitpack.io" }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    }

    loom {
        if (!is120(p)) {
            silentMojangMappingsLicense()
        }
        if (isForge(p)) {
            forge {
                mixinConfig "buildstonetoolkit.mixins.json"
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$project.minecraft_version"
        mappings loom.officialMojangMappings()

        if (isCommon(p)) {
            modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
        } else if (isFabric(p)) {
            modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
            modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
        } else if (isForge(p)) {
            forge "net.minecraftforge:forge:$project.forge_version"
        } else if (isNeoForge(p)) {
            neoForge "net.neoforged:neoforge:$project.neoforge_version"
        }

        if (isCommon(p)) {
            modImplementation "dev.architectury:architectury:$project.architectury_api_version"
        } else if (isNotBaseVersionModule(p)) {
            common(project(path: commonPath, configuration: 'namedElements')) { transitive = false }
            shadowBundle project(path: commonPath, configuration: transformProductionConfiguration)
            modImplementation "dev.architectury:architectury-${project.name}:$project.architectury_api_version"
            modImplementation("mezz.jei:jei-$project.minecraft_version-$project.name:$project.jei_version")
        }

        if (is120(p)) {
            implementation("io.github.llamalad7:mixinextras-$project.name:${project.mixin_extras_version}")
            compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"))
        }
    }

    processResources {
        var replaceProperties = [
                mod_id          : mod_id,
                mod_version     : mod_version,
                mod_name        : mod_name,
                mod_author      : mod_author,
                mod_description : mod_description,
                mod_license     : mod_license,
                minecraft_version: minecraft_version,
                architectury_api_version: architectury_api_version,
                fabric_loader_version: fabric_loader_version,
                file             : [jarVersion: project.mod_version],
        ]

        inputs.properties(replaceProperties)
        filteringCharset = "UTF-8"

        filesMatching(['META-INF/mods.toml', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand(replaceProperties)
        }
    }

    java {
        withSourcesJar()
        if (is120(p)) {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        } else {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
    }

    tasks.withType(JavaCompile).configureEach {
        if (is120(p)) {
            options.release = 17
        } else if (is121(p)) {
            options.release = 21
        } else {
            options.release = 21
        }
    }

    if (!isCommon(p)) {
        shadowJar {
            configurations = [project.configurations.shadowBundle]
            archiveClassifier = 'dev-shadow'
        }

        remapJar {
            inputFile.set shadowJar.archiveFile
        }
    } else if (isNotBaseVersionModule(p)) {
        def sharedRoot = rootProject.file("common")

        sourceSets {
            main {
                java.srcDir sharedRoot.toPath().resolve("src/main/java").toFile()
                resources.srcDir sharedRoot.toPath().resolve("src/main/resources").toFile()
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

def collectJarFrom = { String mc, String loader, String projectPath ->
    def modVer = rootProject.mod_version.toString()
    def destDir = layout.projectDirectory.dir("builds/${modVer}/${mc}/${loader}")

    tasks.register("collect_${mc.replace('.','_')}_${loader}", Copy) {
        group = "distribution"
        description = "Builds ${projectPath} and collects jars into builds/${modVer}/${mc}/${loader}"

        dependsOn("${projectPath}:build")

        from(project(projectPath).layout.buildDirectory.dir("libs"))
        into(destDir)

        include("*-${modVer}.jar")
        exclude("*-sources.jar")
        exclude("*-javadoc.jar")
        exclude("*-shadow.jar")
        exclude("*-dev.jar")
        exclude("*-dev-shadow.jar")
        exclude("*-all.jar")


        doFirst {
            if (destDir.asFile.exists()) {
                destDir.asFile.deleteDir()
            }
            destDir.asFile.mkdirs()
        }
    }
}


// Per-module collectors
collectJarFrom("1.20.1", "fabric",   ":1.20.1:fabric")
collectJarFrom("1.20.1", "forge",    ":1.20.1:forge")
collectJarFrom("1.21.1", "fabric",   ":1.21.1:fabric")
collectJarFrom("1.21.1", "neoforge", ":1.21.1:neoforge")

// Aggregate collectors
tasks.register("collectBuilds120") {
    group = "distribution"
    dependsOn("collect_1_20_1_fabric", "collect_1_20_1_forge")
}
tasks.register("collectBuilds121") {
    group = "distribution"
    dependsOn("collect_1_21_1_fabric", "collect_1_21_1_neoforge")
}
tasks.register("collectBuildsAll") {
    group = "distribution"
    dependsOn("collectBuilds120", "collectBuilds121")
}


import groovy.io.FileType
import groovy.json.JsonSlurper

// helpers
def isVersionCommon = { Project p ->
    def parts = p.path.split(':').findAll { it }
    parts.size() == 2 && parts[1] == 'common' && (parts[0] ==~ /\d+(\.\d+){1,3}/)
}

def parseVer = { String v -> v.split(/\./).collect { it as int } }
def compareVer = { String a, String b ->
    def pa = parseVer(a); def pb = parseVer(b)
    def n = Math.max(pa.size(), pb.size())
    for (int i = 0; i < n; i++) {
        def ai = i < pa.size() ? pa[i] : 0
        def bi = i < pb.size() ? pb[i] : 0
        if (ai != bi) return ai <=> bi
    }
    0
}

def relFileSet = { File root ->
    def out = new LinkedHashSet<String>()
    if (!root.exists()) return out
    root.eachFileRecurse(FileType.FILES) { f ->
        def rel = root.toPath().relativize(f.toPath()).toString().replace('\\','/')
        out.add(rel)
    }
    out
}

def loadBrokenMap = {
    File f = rootProject.file("excludeClassList.json")
    if (!f.exists()) return [:]

    def parsed = new JsonSlurper().parse(f)
    if (!(parsed instanceof Map)) {
        throw new GradleException("excludeClassList.json must be a JSON object: { \"1.21.1\": [\"...\"], ... }")
    }

    def out = [:].withDefault { [] }
    parsed.each { k, v ->
        if (v == null) return
        def ver = k.toString()
        def list = (v instanceof Collection) ? v : [v]
        out[ver] = list.collect { it.toString().replace('\\','/').trim() }.findAll { it }
    }
    out
}

def normalizeExcludePatterns = { Collection<String> rels ->
    rels.collect { p ->
        def s = p.replace('\\','/').trim()
        if (!s) return null
        if (!s.contains("/")) return "**/${s}"
        return s
    }.findAll { it != null }
}


gradle.projectsEvaluated {
    def sharedJava = rootProject.file("common/src/main/java")
    def sharedRes  = rootProject.file("common/src/main/resources")

    def commons = rootProject.subprojects.findAll { isVersionCommon(it) }
    if (commons.size() <= 1) {
        logger.lifecycle("[patch-common] Only one version common found; no patching needed.")
        return
    }

    def verToProj = [:]
    commons.each { p ->
        def ver = p.path.split(':').findAll { it }[0]
        verToProj[ver] = p
    }

    def versions = verToProj.keySet().toList().sort { a, b -> compareVer(a, b) }

    // Load broken patterns and build cumulative inheritance:
    def brokenByVerRaw = loadBrokenMap()
    def brokenByVer = [:].withDefault { [] as List<String> }
    brokenByVerRaw.each { ver, list ->
        brokenByVer[ver] = normalizeExcludePatterns(list)
    }

    def cumulativeBroken = [:].withDefault { new LinkedHashSet<String>() }
    def runningBroken = new LinkedHashSet<String>()
    versions.each { ver ->
        runningBroken.addAll(brokenByVer[ver] ?: [])
        cumulativeBroken[ver] = new LinkedHashSet<String>(runningBroken)
    }

    def relByVer = [:]
    versions.each { v ->
        relByVer[v] = relFileSet(verToProj[v].file("src/main/java"))
    }

    for (int i = 1; i < versions.size(); i++) {
        def patchVer = versions[i]
        def patchP   = verToProj[patchVer]

        def brokenExcludesForPatch = cumulativeBroken[patchVer] as Set<String>

        patchP.logger.lifecycle("[patch-common] ${patchP.path} patches ${verToProj[versions[i-1]].path}")

        def outJavaDir = patchP.layout.buildDirectory.dir("patchedSrc/main/java")
        def outResDir  = patchP.layout.buildDirectory.dir("patchedSrc/main/resources")

        def genJava = patchP.tasks.register("generatePatchedJava", Sync) { Sync t ->
            group = "build setup"
            description = "Generates merged Java sources for ${patchP.path} into build/patchedSrc (for IDE + Gradle)."

            into(outJavaDir)

            duplicatesStrategy = DuplicatesStrategy.INCLUDE


            from(sharedJava) {
                include("**/*.java")
                exclude(brokenExcludesForPatch)
            }

            for (int j = 0; j < i; j++) {
                def v = versions[j]
                def layerProj = verToProj[v]
                def layerJavaDir = layerProj.file("src/main/java")

                def overriddenByLater = new LinkedHashSet<String>()
                for (int k = j + 1; k <= i; k++) {
                    def key = versions[k]
                    def s = relByVer[key]
                    if (s == null) {
                        patchP.logger.lifecycle("[patch-common] WARNING: no rel set for version '${key}' (k=${k}, j=${j}, i=${i})")
                    } else {
                        overriddenByLater.addAll(s as Collection)
                    }
                }

                from(layerJavaDir) {
                    include("**/*.java")
                    exclude(overriddenByLater)
                    exclude(brokenExcludesForPatch)
                }
            }

            from(patchP.file("src/main/java")) {
                include("**/*.java")
            }


            doFirst { delete(destinationDir) }
        }

        def genRes = patchP.tasks.register("generatePatchedResources", Sync) { Sync t ->
            group = "build setup"
            description = "Generates merged resources for ${patchP.path} into build/patchedSrc (for IDE + Gradle)."

            into(outResDir)
            duplicatesStrategy = DuplicatesStrategy.INCLUDE

            from(sharedRes) { include("**/*") }
            for (int j = 0; j < i; j++) {
                from(verToProj[versions[j]].file("src/main/resources")) { include("**/*") }
            }
            from(patchP.file("src/main/resources")) { include("**/*") }

            doFirst { delete(destinationDir) }
        }

        patchP.plugins.withId("java") {
            patchP.extensions.configure(org.gradle.api.tasks.SourceSetContainer) { ss ->
                ss.named("main") { main ->
                    main.java.setSrcDirs([outJavaDir.get().asFile])
                    main.resources.setSrcDirs([outResDir.get().asFile])
                }
            }

            patchP.tasks.named("compileJava").configure {it.dependsOn(genJava)}
            patchP.tasks.named("processResources").configure {it.dependsOn(genRes)}
            patchP.tasks.named("sourcesJar").configure {it.dependsOn(genJava, genRes)}
        }

        patchP.plugins.withId("idea") {
            patchP.idea {
                module {
                    sourceDirs += patchP.file("src/main/java")
                    resourceDirs += patchP.file("src/main/resources")

                    //generatedSourceDirs += outJavaDir.get().asFile
                    //generatedSourceDirs += outResDir.get().asFile
                }
            }
        }

    }


}

def requirePublishFlag = providers.gradleProperty("PUBLISH_RELEASE")
        .map { it.equalsIgnoreCase("true") }
        .orElse(false)

def readChangelog = {
    def f = rootProject.file("changelog.md")
    return f.exists() ? f.getText("UTF-8") : "No changelog.md found."
}

def singleJarFromDir = { String dirPath ->
    providers.provider {
        def dir = rootProject.file(dirPath)
        def ver = rootProject.mod_version.toString()

        def tree = fileTree(dir) {
            include("*-${ver}.jar")
            exclude("*-sources.jar", "*-javadoc.jar", "*-shadow.jar", "*-dev.jar", "*-dev-shadow.jar", "*-all.jar")
        }

        def files = tree.files.toList()
        if (files.isEmpty()) throw new GradleException("No publishable jar found in: ${dir} (expected *-${ver}.jar)")
        if (files.size() > 1) throw new GradleException("Multiple *-${ver}.jar found in ${dir}: ${files*.name}")

        return files[0]
    }
}



tasks.register("publishAllSafe") {
    group = "distribution"
    description = "Publishes ALL collected jars to CurseForge + Modrinth (requires -PPUBLISH_RELEASE=true)."
    dependsOn("publishMods") // task added by mod-publish-plugin
}


publishMods {
    dryRun = !requirePublishFlag.get()

    version = rootProject.mod_version.toString()
    changelog = readChangelog()

    def channel = providers.gradleProperty("release_channel").orElse("release").get().toLowerCase()
    type = (channel == "alpha") ? ALPHA : (channel == "beta") ? BETA : STABLE

    def curseToken = providers.environmentVariable("CURSEFORGE_TOKEN")
    def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")

    def cf = curseforgeOptions {
        accessToken = curseToken
        projectId = providers.gradleProperty("curseforge_id")

        clientRequired = mod_client.asBoolean()
        serverRequired = mod_server.asBoolean()

        requires(curseforge_dependencies.split(","))
    }
    def mr = modrinthOptions {
        accessToken = modrinthToken
        projectId = providers.gradleProperty("modrinth_id")
        requires(modrinth_dependencies.split(","))
    }

    def addVariant = { String name, String mc, String loader ->
        def loaderLabel = (loader == "neoforge") ? "NeoForge" : capitalizeFirst(loader)
        def versionDisplay = "${mod_name} ${mod_version} [${loaderLabel} ${mc}]"
        def versionNumber = "${loader}-${mc}-${mod_version}"
        def javaVersion = mc.startsWith("1.20.") ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21

        def dir = "builds/${mod_version}/${mc}/${loader}"
        def pub = publishOptions {
            file = layout.file(singleJarFromDir(dir))
            displayName = versionDisplay
            modLoaders.add(loader)
        }

        curseforge("curseforge_${name}") {
            from(cf, pub)
            changelogType = "markdown"
            version = versionNumber
            minecraftVersions.add(mc)

            javaVersions.add(javaVersion)
        }

        modrinth("modrinth_${name}") {
            from(mr, pub)
            version = versionNumber
            minecraftVersions.add(mc)
        }
    }

    addVariant("1_20_1_fabric",   "1.20.1", "fabric")
    addVariant("1_20_1_forge",    "1.20.1", "forge")
    addVariant("1_21_1_fabric",   "1.21.1", "fabric")
    addVariant("1_21_1_neoforge", "1.21.1", "neoforge")
}

def collectTaskNameForPublishTask = { String publishTaskName ->
    // publishCurseforge_1_21_1_neoforge -> collect_1_21_1_neoforge
    if (publishTaskName.startsWith("publishCurseforge_")) {
        return publishTaskName.replaceFirst("publishCurseforge_", "collect_")
    }
    // publishModrinth_1_21_1_neoforge -> collect_1_21_1_neoforge
    if (publishTaskName.startsWith("publishModrinth_")) {
        return publishTaskName.replaceFirst("publishModrinth_", "collect_")
    }
    return null
}

tasks.configureEach { t ->
    def ct = collectTaskNameForPublishTask(t.name)
    if (ct != null && tasks.findByName(ct) != null) {
        t.dependsOn(ct)
    }
}

// Make sure the aggregate publish depends on collecting everything
tasks.matching { it.name == "publishMods" }.configureEach {
    dependsOn("collectBuildsAll")
}

tasks.named("publishMods").configure {
    dependsOn("collectBuildsAll")
}

tasks.named("publishMods").configure {
    doFirst {
        if (!providers.gradleProperty("PUBLISH_RELEASE").orElse("false").get().equalsIgnoreCase("true")) {
            logger.lifecycle("publishMods is running in DRY RUN mode. To actually publish: -PPUBLISH_RELEASE=true")
        }
    }
}
