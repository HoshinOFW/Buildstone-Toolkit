pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'buildstonetoolkit'

// autoinclude modules

def versionDirRegex = ~/^\d+(\.\d+){1,3}$/  // 1.20.1, 1.21.1, 1.21.1.1 etc
def knownModules = ["common", "fabric", "forge", "neoforge"] as Set

def root = settingsDir

def versionDirs = root.listFiles()
        ?.findAll { it.isDirectory() && (it.name ==~ versionDirRegex) }
        ?.sort { a, b -> a.name <=> b.name } ?: []

versionDirs.each { verDir ->
    def ver = verDir.name

    def moduleDirs = verDir.listFiles()
            ?.findAll { it.isDirectory() && knownModules.contains(it.name) }
            ?.sort { it.name } ?: []

    moduleDirs.each { modDir ->
        def module = modDir.name

        def path = ":${ver}:${module}"
        include(path)
        project(path).projectDir = modDir
    }
}

if (versionDirs.isEmpty()) {
    logger.lifecycle("[settings] No version directories found (expected e.g. 1.20.1/1.21.1).")
}