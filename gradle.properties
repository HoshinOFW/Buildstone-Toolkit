# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev toggles
# Create fabric slows gradle configuration time down a ton.
# This property is a fallback since there is some auto-detection in build.gradle
create_fabric = true

# Mod properties
mod_version = 2.0.0
mod_id = buildstonetoolkit
mod_description = A mod to bring new tools that enhance the aesthetic capabilities of vanilla redstone
mod_name = Buildstone Toolkit
mod_author = HoshinOFW
mod_license = Apache License 2.0

# Maven
maven_group = com.github.hoshinofw.buildstonetoolkit
archives_name = buildstonetoolkit

# Fabric/loom
fabric_loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Dependencies
mixin_extras_version = 0.5.2
asm_version = 3.3.0

# Publishing
# IDs
curseforge_id=1383196
modrinth_id=m5tBeIGD

# Curseforge data
mod_client=true
mod_server=true
curseforge_dependencies = architectury-api
modrinth_dependencies = architectury-api

# release channel: release / beta / alpha
release_channel=release